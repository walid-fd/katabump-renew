name: Renew KataBump Server

on:
  schedule:
    # يشتغل الساعة 3 صباحًا (UTC) كل 3 أيام تقريبًا (أيام 1، 4، 7، 10... من الشهر)
    - cron: '0 3 */3 * *'
  workflow_dispatch: {} # يسمح بتشغيله يدويًا من تبويب Actions للاختبار

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run renewal script
        env:
          KATABUMP_EMAIL: ${{ secrets.KATABUMP_EMAIL }}
          KATABUMP_PASSWORD: ${{ secrets.KATABUMP_PASSWORD }}
          KATABUMP_SERVER_URL: ${{ secrets.KATABUMP_SERVER_URL }}
        run: npm run renew

      - name: Upload debug screenshots (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: '*.png'
          if-no-files-found: ignore
